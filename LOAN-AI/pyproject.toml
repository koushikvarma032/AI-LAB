[project]
name = "loanhub"
version = "0.1.0"
description = "Professional Digital Lending and Loan Portfolio Management Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.0",
    "Flask-Migrate>=4.0.0",
    "Flask-Login>=0.6.0",
    "Flask-WTF>=1.2.0",
    "SQLAlchemy>=2.0.0",
    "gunicorn>=22.0.0",
    "reportlab>=4.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
