{% extends "base.html" %}

{% block title %}Create Account - LoanHub{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus fs-1 text-primary"></i>
                    <h3 class="fw-bold mt-2">Create Account</h3>
                    <p class="text-muted small">Join LoanHub to access tailored lending programs</p>
                </div>
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                    <div class="row g-2 mb-3">
                        <div class="col-sm-6">
                            <label class="form-label fw-semibold">First Name</label>
                            <input type="text" name="first_name" class="form-control" placeholder="e.g. Rahul">
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label fw-semibold">Last Name</label>
                            <input type="text" name="last_name" class="form-control" placeholder="e.g. Sharma">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="name@domain.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Phone Number</label>
                        <input type="text" name="phone" class="form-control" placeholder="+91 9876543210">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Create a secure password" required minlength="6">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        Register Account
                    </button>
                </form>

                <div class="text-center mt-4 small">
                    <span class="text-muted">Already registered?</span> 
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-semibold">Sign in here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
