{% extends "base.html" %}

{% block title %}Sign In - LoanHub{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-person-circle fs-1 text-primary"></i>
                    <h3 class="fw-bold mt-2">Sign In</h3>
                    <p class="text-muted small">Access your LoanHub portfolio</p>
                </div>
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username or Email</label>
                        <input type="text" name="username" class="form-control" placeholder="Enter username or email" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        Sign In
                    </button>
                </form>

                <div class="text-center mt-4 small">
                    <span class="text-muted">Don't have an account?</span> 
                    <a href="{{ url_for('auth.register') }}" class="text-decoration-none fw-semibold">Register here</a>
                </div>

                <div class="alert alert-light border mt-4 p-2 small text-muted text-center">
                    <b>Demo Credentials:</b><br/>
                    Admin: <code>admin</code> / <code>admin123</code><br/>
                    Applicant: <code>customer</code> / <code>customer123</code>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
